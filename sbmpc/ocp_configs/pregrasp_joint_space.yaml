# PREGRASP OCP tuned for offline optimizer-first MPPI validation.
#
# This cost uses the IK pregrasp joint target as the optimization goal and
# leaves end-effector error for validation/diagnostics. That keeps the rollout
# cost cheap enough to tune on CPU while still solving the Cartesian pregrasp
# task through the IK target, without any trajectory reseed.
name: pregrasp_joint_space
n_weights: 0

running_terms:
  - {name: posture, weight: 90.0}
  - {name: control_regularization, weight: 0.04}
  - {name: joint_velocity, weight: 4.0}
  - {name: mechanical_power, weight: 0.0005}

terminal_terms:
  - {name: posture, weight: 10000.0}
  - {name: joint_velocity, weight: 160.0}
