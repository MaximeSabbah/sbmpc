# PREGRASP controller config.
#
# This is the single tuning surface for both simulation checks and the real
# robot.
name: pregrasp
n_weights: 0

# --- MPPI / solver knobs ---
mpc:
  horizon: 10
  num_samples: 1024          # parallel MPPI rollouts
  num_gain_samples: 128       # same-cycle rollouts differentiated for feedback gains
  num_control_points: 4      # spline control points (<= horizon)
  dt: 0.04
  lambda: 0.03              # lower averages more samples; helps reduce jitter
  std_dev_scale: 0.035      # sampling std-dev = std_dev_scale * torque_limit
  smoothing: Spline          # Spline | null
  initial_guess: gravity     # warm start: zeros | gravity (hold against gravity)
  gains: true                # compute F-MPPI feedback gains in the same control cycle

# --- closed-loop sandbox (scripts/panda_pregrasp.py) ---
sim:
  dt: 0.04
  iterations: 400
  integrator: custom_discrete

# --- trajectory reference policy ---
# The active controller tracks a minimum-jerk joint trajectory from the measured
# start state to the pregrasp IK. The duration is automatically lengthened if the
# measured start is too far to respect max_velocity_fraction.
trajectory:
  enabled: true
  # window: MPC tracks the plan across its horizon (true MPC tracking, default).
  # constant: hold the current plan point across the horizon as a zero-velocity
  #           position setpoint (non-anticipatory, calmer regulator).
  horizon_reference: window
  duration_sec: 5.5
  max_velocity_fraction: 0.20

# --- cost reference policy ---
# With trajectory.enabled=true, q_ref/v_ref are generated by the trajectory.
# u_ref remains gravity at q_ref and u_prev_ref is the previously published tau_ff.
references:
  q_ref: measured          # fallback when trajectory is disabled: measured | goal_ik
  v_ref: zero              # fallback when trajectory is disabled: zero | measured
  u_ref: gravity_q_ref     # gravity_q_ref | zero
  u_prev_ref: previous_control  # previous_control | u_ref | zero

running_terms:
  - {name: position_regularization, weight: 1800.0, params: {weights: [1.0, 1.2, 1.0, 1.2, 0.8, 4.0, 0.8]}}
  - {name: velocity_regularization, weight: 150.0, params: {weights: [1.0, 4.0, 1.2, 4.0, 0.8, 1.6, 0.8]}}
  - {name: ee_position_sq, weight: 400.0}
  - {name: command_rate_regularization, weight: 20.0, params: {scale: torque_limit, weights: [1.0, 3.0, 1.0, 2.5, 0.8, 1.0, 0.8]}}
  - {name: control_regularization, weight: 10.0, params: {scale: torque_limit, weights: [1.0, 3.0, 1.0, 2.5, 0.8, 1.0, 0.8]}}
  - {name: velocity_limit, weight: 1500.0, params: {fraction: 0.8}}

terminal_terms:
  - {name: position_regularization, weight: 3500.0, params: {weights: [1.0, 1.3, 1.0, 1.3, 0.8, 5.0, 0.8]}}
  - {name: velocity_regularization, weight: 300.0, params: {weights: [1.0, 4.0, 1.2, 4.0, 0.8, 1.6, 0.8]}}
  - {name: ee_position_sq, weight: 1200.0}
