# PREGRASP controller config 
name: pregrasp
n_weights: 0

# --- MPPI / solver knobs ---
mpc:
  horizon: 10
  num_samples: 1024          # parallel MPPI rollouts
  num_gain_samples: 256      # same-cycle rollouts differentiated for feedback gains
  num_control_points: 10     # spline control points (<= horizon)
  dt: 0.04
  lambda: 0.05               # temperature: higher = greedier (commits), lower = averages
  std_dev_scale: 0.1         # sampling std-dev = std_dev_scale * torque_limit
  smoothing: Spline          # Spline | null
  initial_guess: gravity     # warm start: zeros | gravity (hold against gravity)
  gains: true                # compute F-MPPI feedback gains in the same control cycle

# --- closed-loop sandbox (scripts/panda_pregrasp.py) ---
sim:
  dt: 0.04
  iterations: 400
  integrator: custom_discrete

running_terms:
  - {name: ee_translation_xy, weight: 120.0}
  - {name: ee_translation_z, weight: 90.0}
  - {name: orientation, weight: 70.0, params: {x_axis_weight: 0.5}}
  - {name: posture, weight: 12.0}
  - {name: control_regularization, weight: 0.25}
  - {name: joint_velocity, weight: 0.1}

terminal_terms:
  - {name: ee_position_sq, weight: 1500.0}
  - {name: orientation, weight: 220.0, params: {x_axis_weight: 0.5}}
  - {name: posture, weight: 90.0}
  - {name: joint_velocity, weight: 15.0}
