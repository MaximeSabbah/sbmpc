# PREGRASP controller config.
#
# This is the single tuning surface for both simulation checks and the real
# robot. Tune it for the real Franka first; simulation is only informative.
name: pregrasp
n_weights: 0

# --- MPPI / solver knobs ---
mpc:
  horizon: 12
  num_samples: 1024          # parallel MPPI rollouts
  num_gain_samples: 128      # same-cycle rollouts differentiated for feedback gains
  num_control_points: 8      # spline control points (<= horizon)
  dt: 0.04
  lambda: 0.1               # temperature: higher = greedier (commits), lower = averages
  # Keep sampling narrower than the original simulation-only controller, but
  # wide enough that MPPI can still discover a real pregrasp reach.
  std_dev_scale: 0.1       # sampling std-dev = std_dev_scale * torque_limit
  smoothing: Spline          # Spline | null
  initial_guess: gravity     # warm start: zeros | gravity (hold against gravity)
  gains: true                # compute F-MPPI feedback gains in the same control cycle

# --- closed-loop sandbox (scripts/panda_pregrasp.py) ---
sim:
  dt: 0.04
  iterations: 400
  integrator: custom_discrete

# --- cost reference policy ---
#
# Costs only consume references. This section decides how the generic
# regularization references are built at runtime.
references:
  q_ref: measured          # measured | goal_ik
  v_ref: zero              # zero | measured
  u_ref: gravity_q_ref     # gravity_q_ref | zero

running_terms:
  - {name: ee_translation_xy, weight: 500.0}
  - {name: ee_translation_z, weight: 15.0}
  - {name: orientation, weight: 300.0, params: {x_axis_weight: 1.0}}
  - {name: position_regularization, weight: 5.0}
  - {name: control_regularization, weight: 0.00005, params: {weights: [1.0, 3.0, 1.0, 2.5, 0.8, 1.5, 0.8]}}
  - {name: velocity_regularization, weight: 80.0, params: {weights: [1.0, 5.0, 1.4, 4.5, 0.8, 5.0, 0.8]}}
  - {name: mechanical_power, weight: 0.01, params: {weights: [1.0, 2.5, 1.0, 2.0, 0.7, 1.5, 0.7]}}

terminal_terms:
  - {name: ee_translation_xy, weight: 100.0}
  - {name: ee_translation_z, weight: 3.0}
  - {name: orientation, weight: 60.0, params: {x_axis_weight: 1.0}}
  - {name: velocity_regularization, weight: 16.0, params: {weights: [1.0, 5.0, 1.4, 4.5, 0.8, 5.0, 0.8]}}
  - {name: position_regularization, weight: 1.0}