# PREGRASP controller config.
#
# This is the single tuning surface for both simulation checks and the real
# robot. Tune it for the real Franka first; simulation is only informative.
name: pregrasp
n_weights: 0

# --- MPPI / solver knobs ---
mpc:
  horizon: 10
  num_samples: 1024          # parallel MPPI rollouts
  num_gain_samples: 128      # same-cycle rollouts differentiated for feedback gains
  num_control_points: 10     # spline control points (<= horizon)
  dt: 0.04
  lambda: 0.05               # temperature: higher = greedier (commits), lower = averages
  # Keep sampling narrower than the original simulation-only controller, but
  # wide enough that MPPI can still discover a real pregrasp reach.
  std_dev_scale: 0.05        # sampling std-dev = std_dev_scale * torque_limit
  smoothing: Spline          # Spline | null
  initial_guess: gravity     # warm start: zeros | gravity (hold against gravity)
  gains: true                # compute F-MPPI feedback gains in the same control cycle

# --- closed-loop sandbox (scripts/panda_pregrasp.py) ---
sim:
  dt: 0.04
  iterations: 400
  integrator: custom_discrete

running_terms:
  - {name: ee_translation_xy, weight: 70.0}
  - {name: ee_translation_z, weight: 60.0}
  - {name: orientation, weight: 70.0, params: {x_axis_weight: 0.5}}
  - {name: posture, weight: 12.0}
  - {name: control_regularization, weight: 5.0}
  - {name: joint_velocity, weight: 50.0}
  - {name: mechanical_power, weight: 0.005}

terminal_terms:
  - {name: ee_position_sq, weight: 300.0}
  - {name: orientation, weight: 200.0, params: {x_axis_weight: 0.5}}
  - {name: posture, weight: 90.0}
  - {name: joint_velocity, weight: 150.0}
