# PREGRASP controller config.
#
# This is the single tuning surface for both simulation checks and the real
# robot.
name: pregrasp
n_weights: 0

# --- MPPI / solver knobs ---
mpc:
  horizon: 10
  num_samples: 1024           # parallel MPPI rollouts
  num_gain_samples: 128       # same-cycle rollouts differentiated for feedback gains
  num_control_points: 4      # spline control points (<= horizon)
  dt: 0.04
  lambda: 0.03              # lower trusts the best samples more during tracking
  std_dev_scale: 0.015      # sampling std-dev = std_dev_scale * torque_limit
  smoothing: Spline          # Spline | null
  initial_guess: gravity     # warm start: zeros | gravity (hold against gravity)
  gains: true                # compute F-MPPI feedback gains in the same control cycle

# --- closed-loop sandbox (scripts/panda_pregrasp.py) ---
sim:
  dt: 0.04
  iterations: 400
  integrator: custom_discrete

# --- mode: trajectory tracking ---
# When trajectory.enabled=true, the planner precomputes a minimum-jerk joint
# plan from the measured start state to the pregrasp IK. Runtime MPC receives a
# moving horizon of q_ref/v_ref plus a MuJoCo inverse-dynamics torque reference
# computed from the same q/v/ddq plan. That torque reference is implicit in this
# mode and is not a YAML tuning knob.
trajectory:
  enabled: true
  # window: MPC tracks the plan across its horizon (true MPC tracking, default).
  # constant: hold the current plan point across the horizon as a zero-velocity
  #           position setpoint (non-anticipatory, calmer regulator).
  horizon_reference: window
  duration_sec: 7.5
  max_velocity_fraction: 0.20

# --- mode: runtime optimizer fallback ---
# These references are used when trajectory.enabled=false. In that mode there is
# no precomputed q/v/tau plan; references.u_ref: zero makes
# control_regularization a torque-minimization term.
references:
  q_ref: measured          # fallback when trajectory is disabled: measured | goal_ik
  v_ref: zero              # fallback when trajectory is disabled: zero | measured
  u_ref: zero              # zero | gravity_q_ref
  u_prev_ref: previous_control  # previous_control | u_ref | zero

# In trajectory tracking mode these same cost terms track the moving-horizon
# reference vector. In optimizer fallback mode they track the static references
# above and minimize torque through control_regularization around zero.
running_terms:
  - {name: position_regularization, weight: 1400.0, params: {weights: [1.0, 1.2, 1.0, 1.2, 0.8, 4.0, 0.8]}}
  - {name: velocity_regularization, weight: 2500.0, params: {weights: [1.0, 4.0, 1.2, 4.0, 0.8, 1.6, 0.8]}}
  - {name: ee_position_sq, weight: 2000.0}
  - {name: control_regularization, weight: 10.0, params: {scale: torque_limit, weights: [1.0, 3.0, 1.0, 2.5, 0.8, 1.0, 0.8]}}
  - {name: velocity_limit, weight: 500.0, params: {fraction: 0.8}}

terminal_terms:
  - {name: position_regularization, weight: 2500.0, params: {weights: [1.0, 1.3, 1.0, 1.3, 0.8, 5.0, 0.8]}}
  - {name: velocity_regularization, weight: 1500.0, params: {weights: [1.0, 4.0, 1.2, 4.0, 0.8, 1.6, 0.8]}}
  - {name: ee_position_sq, weight: 1200.0}
