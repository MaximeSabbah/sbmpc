[project]
name = "sbmpc"
authors = [
  { name="Tommaso Belvedere", email="tommaso.belvedere@irisa.fr" },
  { name="Giulio Turrisi", email="giulio.turrisi@iit.it" },
  { name="Valerio Modugno", email="v.modugno@ucl.ac.uk" },
  { name="Chidinma Ezeji"},
  { name="Michael Ziegltrum", email="mzandtheraspberrypi@gmail.com" },
]
dynamic = ["version"]
description = "A package to do sampling based trajectory control for robotic applications."
dependencies = [
    "numpy",
    "matplotlib",
    "jax>=0.8.0",
    "control",
    "mujoco-mjx",
    "interpax",
    "equinox>=0.13.4"
    ]
readme = "README.md"
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/tombelv/sbmpc"
Issues = "https://github.com/tombelv/sbmpc/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.15",
]
panda = [
    "jaxsim>=0.8.1",
    "robot_descriptions>=1.17.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

# Pixi configuration
[tool.pixi.workspace]
channels = ["conda-forge", "nvidia"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = "3.12.*"
pinocchio = ">=3.9.0,<4"
casadi = ">=3.7.2,<4"

[tool.pixi.tasks]
build = "hatch build"

[tool.pixi.pypi-dependencies]
sbmpc = { path = ".", editable = true, extras = ["dev", "panda"] }
hatch-vcs = "*"
hatch = "*"

# CUDA feature (Linux only)
[tool.pixi.feature.cuda]
platforms = ["linux-64"]

[tool.pixi.feature.cuda.dependencies]
cuda-nvcc = "*"

[tool.pixi.feature.cuda.pypi-dependencies]
jaxlib = "*"
jax = { version = ">=0.8.0", extras = ["cuda12"] }

[tool.pixi.environments]
default = { solve-group = "default" }
cuda = ["cuda"]
